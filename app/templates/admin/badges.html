{% extends "base.html" %}
{% block content %}
<div class="dashboard-container">
    <h2>🏅 Manage Badges</h2>

    <a href="{{ url_for('admin.add_badge') }}" class="btn">➕ Add Badge</a>

    <table class="styled-table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Criteria</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for badge in badges %}
            <tr>
                <td>{{ badge.name }}</td>
                <td>{{ badge.description }}</td>
                <td>{{ badge.criteria }}</td>
                <td>
                    <a href="{{ url_for('admin.edit_badge', id=badge.id) }}" class="btn small">✏️ Edit</a>
                    <form action="{{ url_for('admin.delete_badge', id=badge.id) }}" method="POST" style="display:inline;">
                        <button type="submit" class="btn small danger">🗑️ Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="{{ url_for('admin.admin_home') }}" class="btn secondary">← Back to Admin Dashboard</a>
</div>
{% endblock %}
