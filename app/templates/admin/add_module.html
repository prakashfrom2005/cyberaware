{% extends "base.html" %}
{% block title %}Add Module - Admin{% endblock %}
{% block content %}
<h1>Add Module</h1>
<form method="POST" class="form">
  <div class="form-row">
    <label class="label">Title</label>
    <input class="input" name="title" required>
  </div>
  <div class="form-row">
    <label class="label">Description</label>
    <input class="input" name="description" required>
  </div>
  <div class="form-row">
    <label class="label">Content</label>
    <textarea class="input" name="content" rows="8" required></textarea>
  </div>
  <button type="submit" class="btn">Add Module</button>
</form>
{% endblock %}
