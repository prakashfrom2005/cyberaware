{% extends 'base.html' %}
{% block content %}
<h2>🧠 Cybersecurity Learning Modules</h2>
<ul>
  {% for module in modules %}
    <li>
      <strong>{{ module.title }}</strong><br>
      <a href="{{ url_for('module.view_module', module_id=module.id) }}">
        <button>Start Learning</button>
      </a>
    </li>
    <hr>
  {% endfor %}
</ul>
<a href="{{ url_for('user.dashboard') }}">← Back to Dashboard</a>
{% endblock %}
