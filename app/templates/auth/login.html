{% extends "base.html" %}
{% block title %}Login - CyberSec{% endblock %}
{% block content %}
<div class="auth-wrap">
  <section class="auth panel auth">
    <h2>🔐 Login</h2>
    <p class="sub" style="margin-bottom:14px">Welcome back! Please sign in.</p>

    <form method="POST" class="form">
      <div class="form-row">
        <label class="label">Email</label>
        <input class="input" name="email" type="email" placeholder="you@example.com" required>
      </div>

      <div class="form-row">
        <label class="label">Password</label>
        <input class="input" name="password" type="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn">Login</button>
    </form>

    <p class="sub" style="margin-top:14px">
      New here?
      <a href="{{ url_for('auth.register') }}">Create an account</a>
    </p>
  </section>
</div>
{% endblock %}
